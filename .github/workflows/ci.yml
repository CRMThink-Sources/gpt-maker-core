name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # @crmthink-sources/platform-sdk vem do GitHub Packages (.npmrc lê GITHUB_TOKEN)
  packages: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  checks:
    name: Lint, tipos e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @gptmaker/contracts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run depcruise
      - name: Migrações em dia com o schema Drizzle
        run: |
          npm run db:generate -w backend
          test -z "$(git status --porcelain backend/drizzle)" || {
            echo "::error::Schema alterado sem migração: rode 'npm run db:generate -w backend' e commite backend/drizzle"
            git status --porcelain backend/drizzle
            exit 1
          }
      - run: npm test
      - run: npm run build -w backend
      - run: npm run build -w frontend

  integration:
    name: Testes de integração (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @gptmaker/contracts
      # Postgres, RabbitMQ e Redis via Testcontainers; WireMock e fixtures assinadas entram por seção.
      - run: npm run test:integration -w backend

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=frontend
