name: Deploy

# staging: automático após cada release bem-sucedido em develop.
# production: automático após release em master, com a aprovação exigida pelas regras de proteção
# do GitHub Environment "production". workflow_dispatch serve para redeploy/rollback de uma tag
# (SHA) já publicada.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        type: choice
        options: [staging, production]
        default: production
      image_tag:
        description: Tag da imagem (SHA do commit)
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'master' && 'production' || 'staging') }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event.workflow_run.head_sha }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'master' && 'production' || 'staging') }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'master' && 'production' || 'staging') }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
      - uses: ./.github/actions/deploy-droplet
        with:
          image-tag: ${{ env.IMAGE_TAG }}
          ssh-host: ${{ vars.DEPLOY_HOST }}
          ssh-user: ${{ vars.DEPLOY_USER }}
          deploy-dir: ${{ vars.DEPLOY_DIR }}
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          env-file: ${{ secrets.ENV_FILE }}
          ghcr-user: ${{ github.actor }}
          ghcr-token: ${{ secrets.GHCR_PULL_TOKEN }}
