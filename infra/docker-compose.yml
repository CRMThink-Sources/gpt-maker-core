# Ambiente de desenvolvimento.
#   Só infraestrutura (API/worker/frontend rodando local com hot reload):
#     docker compose -f infra/docker-compose.yml up -d
#   Portas do host sobrescrevíveis: POSTGRES_PORT, REDIS_PORT, RABBITMQ_PORT, RABBITMQ_UI_PORT.
#   Tudo em containers (imagens de produção):
#     docker compose -f infra/docker-compose.yml --profile app up -d --build
name: gptmaker-dev

x-backend-env: &backend-env
  NODE_ENV: development
  LOG_LEVEL: debug
  DATABASE_URL: postgres://gptmaker:gptmaker@postgres:5432/gptmaker
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://gptmaker:gptmaker@rabbitmq:5672
  GPTMAKER_API_URL: ${GPTMAKER_API_URL:-https://api.gptmaker.ai/v2}
  GPTMAKER_API_TOKEN: ${GPTMAKER_API_TOKEN:-trocar}
  GPTMAKER_WORKSPACE_ID: ${GPTMAKER_WORKSPACE_ID:-trocar}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
  PLATFORM_URL: ${PLATFORM_URL:-https://platform-staging.crmthink.com.br}
  PLATFORM_API_KEY: ${PLATFORM_API_KEY:-trocar}
  PLATFORM_WEBHOOK_SECRETS: ${PLATFORM_WEBHOOK_SECRETS:-trocar}
  DATA_ENCRYPTION_KEY: ZGV2LWtleS1kZXYta2V5LWRldi1rZXktZGV2LWtleSE=
  STORAGE_ENDPOINT: http://storage:8333
  STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:8333}
  STORAGE_ACCESS_KEY: gptmaker
  STORAGE_SECRET_KEY: gptmaker123
  STORAGE_FORCE_PATH_STYLE: 'true'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gptmaker
      POSTGRES_PASSWORD: gptmaker
      POSTGRES_DB: gptmaker
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gptmaker -d gptmaker']
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: gptmaker
      RABBITMQ_DEFAULT_PASS: gptmaker
    ports: ['${RABBITMQ_PORT:-5672}:5672', '${RABBITMQ_UI_PORT:-15672}:15672']
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['${REDIS_PORT:-6379}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Substitui o DigitalOcean Spaces em dev (S3 compatível em http://localhost:8333).
  # MinIO deixou de publicar imagens; SeaweedFS atende a mesma API S3.
  storage:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ['8333:8333']
    volumes:
      - storage-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 30

  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      storage: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: gptmaker
      AWS_SECRET_ACCESS_KEY: gptmaker123
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['sh', '-c']
    # Retenta até o gateway S3 aceitar conexões; bucket já existente não é erro.
    command:
      - >
        for i in $$(seq 1 30); do
        aws --endpoint-url http://storage:8333 s3api head-bucket --bucket gptmaker-trainings 2>/dev/null && exit 0;
        aws --endpoint-url http://storage:8333 s3 mb s3://gptmaker-trainings && exit 0;
        sleep 2; done; exit 1
    restart: 'no'

  backend-api:
    profiles: [app]
    build: { context: .., dockerfile: backend/Dockerfile, secrets: [github_token] }
    environment:
      <<: *backend-env
      APP_ROLE: api
      PORT: 3001
    ports: ['3001:3001']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health/ready']
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on: &backend-deps
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  backend-worker:
    profiles: [app]
    build: { context: .., dockerfile: backend/Dockerfile, secrets: [github_token] }
    command: ['node', 'dist/main.worker.js']
    environment:
      <<: *backend-env
      APP_ROLE: worker
      WORKER_HTTP_PORT: 9464
    ports: ['9464:9464']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9464/health/live']
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on: *backend-deps

  frontend:
    profiles: [app]
    build: { context: .., dockerfile: frontend/Dockerfile, secrets: [github_token] }
    ports: ['3000:3000']
    environment:
      PUBLIC_PLATFORM_URL: ${PLATFORM_URL:-https://platform-staging.crmthink.com.br}
      PUBLIC_API_BASE_URL: http://localhost:3001
      PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      API_INTERNAL_URL: http://backend-api:3001
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/app']
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on: [backend-api]

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  storage-data:

secrets:
  # npm ci no build baixa @crmthink-sources/platform-sdk do GitHub Packages (read:packages)
  github_token:
    environment: GITHUB_TOKEN
