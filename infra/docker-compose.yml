# Ambiente de desenvolvimento.
#   Só infraestrutura (API/worker/frontend rodando local com hot reload):
#     docker compose -f infra/docker-compose.yml up -d
#   Tudo em containers (imagens de produção):
#     docker compose -f infra/docker-compose.yml --profile app up -d --build
name: gptmaker-dev

x-backend-env: &backend-env
  NODE_ENV: development
  LOG_LEVEL: debug
  DATABASE_URL: postgres://gptmaker:gptmaker@postgres:5432/gptmaker
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://gptmaker:gptmaker@rabbitmq:5672

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gptmaker
      POSTGRES_PASSWORD: gptmaker
      POSTGRES_DB: gptmaker
    ports: ['5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gptmaker -d gptmaker']
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: gptmaker
      RABBITMQ_DEFAULT_PASS: gptmaker
    ports: ['5672:5672', '15672:15672']
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Substitui o DigitalOcean Spaces em dev (S3 compatível). Console: http://localhost:9001
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: gptmaker
      MINIO_ROOT_PASSWORD: gptmaker123
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 gptmaker gptmaker123 &&
             mc mb --ignore-existing local/gptmaker-trainings"
    restart: 'no'

  backend-api:
    profiles: [app]
    build: { context: .., dockerfile: backend/Dockerfile }
    environment:
      <<: *backend-env
      APP_ROLE: api
      PORT: 3001
    ports: ['3001:3001']
    depends_on: &backend-deps
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  backend-worker:
    profiles: [app]
    build: { context: .., dockerfile: backend/Dockerfile }
    command: ['node', 'dist/main.worker.js']
    environment:
      <<: *backend-env
      APP_ROLE: worker
      WORKER_HTTP_PORT: 9464
    ports: ['9464:9464']
    depends_on: *backend-deps

  frontend:
    profiles: [app]
    build: { context: .., dockerfile: frontend/Dockerfile }
    ports: ['3000:3000']
    depends_on: [backend-api]

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  minio-data:
