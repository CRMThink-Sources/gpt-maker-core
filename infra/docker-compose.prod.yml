# Produção e staging (podem dividir o mesmo Droplet). Variáveis vêm do .env gerado pelo deploy.yml,
# que define STACK_NAME (gptmaker-staging | gptmaker-production) e DATA_DIR por ambiente.
# O TLS e as portas 80/443 ficam no proxy único de infra/edge; aqui só entramos na rede `edge`.
#   IMAGE_TAG=<sha> docker compose -f docker-compose.prod.yml --env-file .env up -d
name: ${STACK_NAME:?STACK_NAME ausente no .env}

x-backend: &backend
  image: ghcr.io/${GHCR_OWNER}/gptmaker-backend:${IMAGE_TAG}
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging: &logging
    driver: json-file
    options: { max-size: 20m, max-file: '5' }

services:
  frontend:
    image: ghcr.io/${GHCR_OWNER}/gptmaker-frontend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PUBLIC_PLATFORM_URL: ${PUBLIC_PLATFORM_URL}
      PUBLIC_APP_CODE: ${APP_CODE}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      PUBLIC_STRIPE_PUBLISHABLE_KEY: ${PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      PUBLIC_SUPPORT_URL: ${PUBLIC_SUPPORT_URL:-}
      # Repasse do backoffice (/admin/api) para a API pela rede interna
      API_INTERNAL_URL: http://${STACK_NAME}-api:3001
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/app']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      default:
      edge:
        aliases: ['${STACK_NAME}-web']
    logging: *logging

  backend-api:
    <<: *backend
    environment:
      APP_ROLE: api
      PORT: 3001
    networks:
      default:
      edge:
        aliases: ['${STACK_NAME}-api']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health/live']
      interval: 15s
      timeout: 5s
      retries: 5

  backend-worker:
    <<: *backend
    command: ['node', 'dist/main.worker.js']
    environment:
      APP_ROLE: worker
      WORKER_HTTP_PORT: 9464
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9464/health/live']
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Dados no DigitalOcean Volume montado em DATA_DIR.
    volumes: ['${DATA_DIR:-/mnt/gptmaker-data}/postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - '${DATA_DIR:-/mnt/gptmaker-data}/rabbitmq:/var/lib/rabbitmq'
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['${DATA_DIR:-/mnt/gptmaker-data}/redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

networks:
  edge:
    name: edge
    external: true
